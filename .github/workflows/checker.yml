name: Zoho People Check-In/Out Automation

on:
  schedule:
    # Check-in at 10 PM UTC (adjust timezone as needed)
    - cron: '0 22 * * 0,1,2,3,4'
    # Check-out at 6 PM UTC
    - cron: '0 18 * * 0,1,2,3,4'
  workflow_dispatch:  # Allow manual trigger

jobs:
  automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv
      
      - name: Run check-in/out automation
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python checker.py
