name: Zoho Check-Out

on:
  schedule:
    # 6 PM every day Sunday to Thursday
    # Adjust the time based on your timezone
    # Format: minute hour * * day-of-week
    # 0-4 = Sunday to Thursday
    - cron: '0 18 * * 0-4'

  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  checkout:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv
      
      - name: Run Check-Out
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: 'true'
        run: python checkout.py
